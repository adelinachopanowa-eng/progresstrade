<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROGRESSTRADE – Лого</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1c1c1c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 56px;
    padding: 60px 40px;
  }

  .label {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #444;
    text-align: center;
    margin-bottom: 20px;
  }

  .variant { display: flex; flex-direction: column; align-items: center; }

  .box {
    padding: 50px 70px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .wordmark {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 30px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- WHITE BG -->
<div class="variant">
  <div class="label">Бял фон</div>
  <div class="box" style="background:#ffffff">
    <div class="logo">
      <svg width="46" height="50" viewBox="0 0 46 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- back leaf (darker, bottom-left) -->
        <path d="M8 42 C8 42 6 24 20 16 C20 16 24 30 12 42 Z" fill="#1a5c1a"/>
        <!-- front leaf (brighter, top-right) -->
        <path d="M18 36 C18 36 20 18 34 10 C34 10 38 24 22 36 Z" fill="#3ab53a"/>
      </svg>
      <div class="wordmark" style="color:#1a5c1a">PROGRESSTRADE</div>
    </div>
  </div>
</div>

<!-- BLACK BG -->
<div class="variant">
  <div class="label">Черен фон</div>
  <div class="box" style="background:#0d0d0d">
    <div class="logo">
      <svg width="46" height="50" viewBox="0 0 46 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 42 C8 42 6 24 20 16 C20 16 24 30 12 42 Z" fill="#1a7a1a"/>
        <path d="M18 36 C18 36 20 18 34 10 C34 10 38 24 22 36 Z" fill="#4ecb4e"/>
      </svg>
      <div class="wordmark" style="color:#4ecb4e">PROGRESSTRADE</div>
    </div>
  </div>
</div>

<!-- DARK GREEN BG -->
<div class="variant">
  <div class="label">Тъмно зелен фон</div>
  <div class="box" style="background:#0f2e0f">
    <div class="logo">
      <svg width="46" height="50" viewBox="0 0 46 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 42 C8 42 6 24 20 16 C20 16 24 30 12 42 Z" fill="#4ecb4e"/>
        <path d="M18 36 C18 36 20 18 34 10 C34 10 38 24 22 36 Z" fill="#9ee89e"/>
      </svg>
      <div class="wordmark" style="color:#ffffff">PROGRESSTRADE</div>
    </div>
  </div>
</div>

</body>
</html>
