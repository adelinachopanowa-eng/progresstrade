<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progresstrade — Wireframe варианти</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f0; font-family: 'Space Grotesk', sans-serif; }

  /* Sketchy style globals */
  .sk { font-family: 'Caveat', cursive; }
  .sketch-border { border: 2px solid #222; border-radius: 3px; }
  .sketch-box { border: 2px solid #333; background: #fff; border-radius: 2px; }
  .sketch-fill-green { background: #1a4a2e; border: 2px solid #333; }
  .sketch-fill-yellow { background: #f0c040; border: 2px solid #333; }
  .sketch-fill-gray { background: #d0d0c8; border: 2px solid #333; }
  .sketch-fill-dark { background: #222; border: 2px solid #333; }
  .sketch-img { background: repeating-linear-gradient(45deg, #ccc 0px, #ccc 1px, #e8e8e0 1px, #e8e8e0 8px); border: 2px solid #333; display: flex; align-items: center; justify-content: center; }
  .sketch-img span { font-family: 'Caveat', cursive; font-size: 11px; color: #555; text-align: center; padding: 4px; }

  /* Logo variants row */
  .logo-section { padding: 32px 40px 8px; }
  .logo-section h2 { font-family: 'Caveat', cursive; font-size: 28px; color: #333; margin-bottom: 16px; border-bottom: 2px dashed #aaa; padding-bottom: 8px; }
  .logos-row { display: flex; gap: 24px; flex-wrap: wrap; }

  /* Canvas label */
  .variant-label { font-family: 'Caveat', cursive; font-size: 22px; color: #555; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .variant-label span.badge { background: #f0c040; border: 2px solid #333; border-radius: 2px; padding: 2px 10px; font-size: 16px; color: #222; }
</style>
</head>
<body>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">

/* ─────────────────────────────────────────
   SHARED SKETCH PRIMITIVES
───────────────────────────────────────── */

const C = {
  green: '#1a4a2e',
  yellow: '#f0c040',
  white: '#fff',
  gray: '#d0d0c8',
  dark: '#1a1a1a',
  mid: '#888',
  light: '#f0efe8',
};

function SketchImg({ w, h, label, style }) {
  return (
    <div style={{
      width: w || '100%', height: h || 120,
      background: 'repeating-linear-gradient(45deg,#bbb 0,#bbb 1px,#e4e4dc 1px,#e4e4dc 9px)',
      border: '2px solid #333', borderRadius: 2, display: 'flex',
      alignItems: 'center', justifyContent: 'center', flexShrink: 0,
      ...style
    }}>
      <span style={{ fontFamily: 'Caveat', fontSize: 11, color: '#555', textAlign: 'center', padding: 4 }}>{label}</span>
    </div>
  );
}

function SketchBtn({ label, variant = 'yellow', style }) {
  const bg = variant === 'yellow' ? C.yellow : variant === 'green' ? C.green : C.gray;
  const color = variant === 'green' ? '#fff' : '#222';
  return (
    <div style={{
      background: bg, border: '2.5px solid #222', borderRadius: 2, padding: '7px 18px',
      fontFamily: 'Caveat', fontSize: 15, color, display: 'inline-block',
      boxShadow: '2px 2px 0 #222', ...style
    }}>{label}</div>
  );
}

function SketchBar({ label, height = 44, bg = C.green, style }) {
  return (
    <div style={{
      background: bg, border: '2px solid #222', height,
      display: 'flex', alignItems: 'center', paddingLeft: 12, ...style
    }}>
      <span style={{ fontFamily: 'Caveat', fontSize: 13, color: bg === C.yellow ? '#222' : '#fff' }}>{label}</span>
    </div>
  );
}

function SketchText({ children, size = 12, bold, color = '#333', style }) {
  return (
    <p style={{
      fontFamily: 'Caveat', fontSize: size, color, lineHeight: 1.3,
      fontWeight: bold ? 700 : 400, ...style
    }}>{children}</p>
  );
}

function SketchCard({ children, style }) {
  return (
    <div style={{
      border: '2px solid #333', borderRadius: 2, background: '#fff',
      padding: 10, ...style
    }}>{children}</div>
  );
}

function SketchDivider() {
  return <div style={{ borderBottom: '2px dashed #bbb', margin: '8px 0' }} />;
}

/* ─────────────────────────────────────────
   LOGO VARIANTS  (3 options)
───────────────────────────────────────── */

function LogoV1() {
  // RAGG-style: colored block + bold word
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 0, border: '2px solid #333', borderRadius: 2, overflow: 'hidden', boxShadow: '3px 3px 0 #aaa' }}>
      <div style={{ background: C.yellow, padding: '8px 10px', borderRight: '2px solid #333' }}>
        <span style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 20, color: C.green, letterSpacing: -1 }}>PT</span>
      </div>
      <div style={{ background: C.green, padding: '8px 14px' }}>
        <span style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 14, color: '#fff', letterSpacing: 1, textTransform: 'uppercase' }}>PROGRESSTRADE</span>
      </div>
    </div>
  );
}

function LogoV2() {
  // Arrow icon + stacked text
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, border: '2.5px solid #333', borderRadius: 2, padding: '6px 16px', background: '#fff', boxShadow: '3px 3px 0 #aaa' }}>
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="13" fill={C.yellow} stroke="#222" strokeWidth="2"/>
        <polyline points="8,14 14,8 20,14" stroke={C.green} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
        <line x1="14" y1="8" x2="14" y2="21" stroke={C.green} strokeWidth="2.5" strokeLinecap="round"/>
      </svg>
      <div>
        <div style={{ fontFamily: 'Space Grotesk', fontWeight: 700, fontSize: 15, color: C.green, letterSpacing: 0.5, lineHeight: 1 }}>PROGRESS</div>
        <div style={{ fontFamily: 'Space Grotesk', fontWeight: 400, fontSize: 11, color: '#555', letterSpacing: 3, textTransform: 'uppercase' }}>TRADE</div>
      </div>
    </div>
  );
}

function LogoV3() {
  // Recycle icon + single bold line
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, border: '2px solid #333', borderRadius: 2, padding: '5px 14px', background: C.dark, boxShadow: '3px 3px 0 #aaa' }}>
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <rect width="26" height="26" rx="2" fill={C.yellow}/>
        <text x="13" y="19" textAnchor="middle" fontFamily="Space Grotesk" fontWeight="700" fontSize="14" fill={C.green}>♻</text>
      </svg>
      <div style={{ fontFamily: 'Space Grotesk', fontWeight: 800, fontSize: 16, color: '#fff', letterSpacing: 1, textTransform: 'uppercase' }}>
        Progress<span style={{ color: C.yellow }}>trade</span>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   VARIANT A — "Hero Bold" (RAGG-inspired)
   Big green hero + yellow CTA bar
───────────────────────────────────────── */
function VariantA() {
  const W = 360;
  return (
    <div style={{ width: W, fontFamily: 'Caveat' }}>
      {/* Nav */}
      <div style={{ background: C.green, border: '2px solid #222', height: 40, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 12px' }}>
        <LogoV1 />
        <div style={{ display: 'flex', gap: 10 }}>
          {['Услуги','За нас','Контакти'].map(t => <span key={t} style={{ color: '#ccc', fontSize: 11 }}>{t}</span>)}
        </div>
        <SketchBtn label="Обади се" variant="yellow" style={{ fontSize: 11, padding: '4px 10px', boxShadow: '1px 1px 0 #222' }} />
      </div>

      {/* Hero */}
      <div style={{ position: 'relative' }}>
        <SketchImg h={180} label="📷 фото на склад / кран с скрап" />
        <div style={{
          position: 'absolute', top: 0, right: 0, bottom: 0, width: '50%',
          background: 'rgba(26,74,46,0.92)', border: 'none',
          display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: 14
        }}>
          <SketchText size={22} bold color={C.yellow}>Изкупуваме желязо и скрап</SketchText>
          <SketchText size={12} color="#ccc" style={{ marginTop: 6 }}>Гр. София, Военна Рампа</SketchText>
          <div style={{ marginTop: 10, display: 'flex', gap: 8 }}>
            <SketchBtn label="Обади се сега" variant="yellow" style={{ fontSize: 12 }} />

      </div>

      {/* 4 USP chips */}
      <div style={{ background: C.yellow, border: '2px solid #222', borderTop: 'none', display: 'flex', justifyContent: 'space-around', padding: '8px 4px' }}>
        {['💰 Плащаме веднага','🚛 Идваме на място','📈 Най-висока цена','📍 Лесно разтоварване'].map(u => (
          <SketchText key={u} size={10} bold>{u}</SketchText>

      {/* Services grid */}
      <div style={{ padding: 14 }}>
        <SketchText size={16} bold style={{ marginBottom: 10 }}>Какво изкупуваме?</SketchText>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>

            { icon: '🚗', title: 'Коли за скрап', sub: 'Изкупуване и разкомплектоване ИУМПС' },
            { icon: '📦', title: 'Стари уреди', sub: 'ИУЕЕО — перални, хладилници и др.' },
            { icon: '🚛', title: 'Транспорт', sub: 'Идваме на място за по-големи количества' },
          ].map(s => (
            <SketchCard key={s.title} style={{ padding: 8 }}>
              <div style={{ fontSize: 18, marginBottom: 4 }}>{s.icon}</div>
              <SketchText size={13} bold>{s.title}</SketchText>
              <SketchText size={10} color="#666">{s.sub}</SketchText>
            </SketchCard>
          ))}
        </div>
      </div>

      {/* Who we serve */}
      <div style={{ background: C.green, padding: 14, margin: '0 0 0 0', border: '2px solid #222', borderLeft: 'none', borderRight: 'none' }}>
        <SketchText size={15} bold color={C.yellow}>За кого работим?</SketchText>
        <div style={{ marginTop: 8, display: 'flex', gap: 8, flexDirection: 'column' }}>
          {['🔧 Сервизи за камиони и коли', '🏗️ Строителни компании', '🏭 Металообработващи предприятия'].map(t => (
            <div key={t} style={{ border: '1.5px solid #f0c04066', borderRadius: 2, padding: '5px 8px' }}>
              <SketchText size={11} color="#eee">{t}</SketchText>
            </div>
          ))}
        </div>
      </div>

      {/* CTA */}
      <div style={{ padding: 16, textAlign: 'center' }}>
        <SketchText size={16} bold>Имате скрап за продажба?</SketchText>
        <SketchText size={11} color="#666" style={{ marginTop: 4 }}>Обадете се или ни пишете — отговаряме бързо</SketchText>
        <div style={{ marginTop: 12 }}>
          <SketchBtn label="📞 0893 416 559" variant="green" style={{ fontSize: 14, marginRight: 8 }} />
        </div>
      </div>

      {/* Footer */}
      <div style={{ background: C.dark, padding: 12, border: '2px solid #222', borderBottom: 'none' }}>
        <SketchText size={10} color="#aaa">Progresstrade © 2026 | ул. Проф Иван Георгов 1, Военна Рампа, София</SketchText>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   VARIANT B — "Split Diagonal"
   Yellow + dark split, angled sections
───────────────────────────────────────── */
function VariantB() {
  const W = 360;
  return (
    <div style={{ width: W, fontFamily: 'Caveat' }}>
      {/* Nav */}
      <div style={{ background: '#fff', border: '2px solid #222', height: 42, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 14px' }}>
        <LogoV2 />
        <SketchBtn label="☎ Обади се" variant="green" style={{ fontSize: 11, padding: '3px 10px', boxShadow: '1px 1px 0 #222' }} />
      </div>

      {/* Hero — full bleed image + big title below */}
      <SketchImg h={140} label="📷 снимка — кран/тир/скрап от птичи поглед" />

      <div style={{ background: C.yellow, border: '2px solid #222', borderTop: 'none', padding: '16px 16px 20px' }}>
        <SketchText size={26} bold color={C.green}>Продай скрапа си.</SketchText>
        <SketchText size={26} bold color={C.dark}>Плащаме веднага.</SketchText>
        <SketchText size={12} color="#444" style={{ marginTop: 6 }}>Желязо, ИУМПС, уреди — всичко изкупуваме в София</SketchText>
        <div style={{ marginTop: 12, display: 'flex', gap: 8 }}>
          <SketchBtn label="Свържи се с нас" variant="green" />

        </div>
      </div>

      {/* 3 big stats */}
      <div style={{ display: 'flex', border: '2px solid #222', borderTop: 'none' }}>
        {[{ n: '#1', l: 'Цена за желязо' }, { n: '24/7', l: 'Отговаряме' }, { n: '100%', l: 'Плащане в брой' }].map((s, i) => (
          <div key={i} style={{
            flex: 1, padding: '12px 8px', textAlign: 'center',
            borderRight: i < 2 ? '2px solid #222' : 'none',
            background: i === 1 ? C.green : '#fff'
          }}>
            <SketchText size={22} bold color={i === 1 ? C.yellow : C.green}>{s.n}</SketchText>
            <SketchText size={10} color={i === 1 ? '#ccc' : '#666'}>{s.l}</SketchText>
          </div>
        ))}
      </div>

      {/* Services — horizontal scroll list */}
      <div style={{ padding: 14 }}>
        <SketchText size={15} bold style={{ marginBottom: 10 }}>Нашите услуги</SketchText>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {[
            ['⚙️ Черни метали', 'Плътно желязо, тънко желязо, технологичен отпадък'],
            ['🚗 ИУМПС', 'Коли за скрап — изкупуваме и разкомплектоваме'],
            ['📱 Стари уреди', 'Перални, хладилници, ИУЕЕО'],
            ['🚛 Транспорт', 'Идваме на адрес при по-големи количества'],
          ].map(([title, sub]) => (
            <div key={title} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, borderBottom: '1.5px dashed #ccc', paddingBottom: 8 }}>
              <SketchText size={20}>{title.split(' ')[0]}</SketchText>
              <div>
                <SketchText size={13} bold>{title.slice(3)}</SketchText>
                <SketchText size={10} color="#666">{sub}</SketchText>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Image + process */}
      <div style={{ display: 'flex', border: '2px solid #222', borderLeft: 'none', borderRight: 'none' }}>
        <SketchImg w={130} h={160} label="📷 газокислородно рязане" style={{ borderTop: 'none', borderBottom: 'none', borderLeft: 'none' }} />
        <div style={{ flex: 1, padding: 12, background: '#fafaf5' }}>
          <SketchText size={14} bold style={{ marginBottom: 8 }}>Как работи?</SketchText>
          {['1. Обадете се', '2. Оценяваме безплатно', '3. Идваме и товарим', '4. Плащаме веднага'].map(s => (
            <SketchText key={s} size={11} style={{ marginBottom: 4 }}>→ {s}</SketchText>
          ))}
        </div>
      </div>

      {/* Contact */}
      <div style={{ background: C.green, padding: 14, border: '2px solid #222', borderTop: 'none', borderLeft: 'none', borderRight: 'none', textAlign: 'center' }}>
        <SketchText size={17} bold color={C.yellow}>Обадете се сега</SketchText>
        <SketchText size={22} bold color="#fff" style={{ marginTop: 4 }}>0893 416 559</SketchText>
        <SketchText size={10} color="#aaa" style={{ marginTop: 4 }}>ул. Проф Иван Георгов 1, Военна Рампа, София</SketchText>
      </div>

      {/* Footer */}
      <div style={{ background: C.dark, padding: 10 }}>
        <SketchText size={10} color="#777">© 2026 Progresstrade. Всички права запазени.</SketchText>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   VARIANT C — "Dark Industrial"
   Almost black + yellow accent, no-frills
───────────────────────────────────────── */
function VariantC() {
  const W = 360;
  return (
    <div style={{ width: W, fontFamily: 'Caveat', background: '#1a1a18' }}>
      {/* Nav */}
      <div style={{ border: '2px solid #333', borderTop: 'none', height: 44, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 14px', borderLeft: 'none', borderRight: 'none' }}>
        <LogoV3 />
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          {['Услуги','Контакти'].map(t => <span key={t} style={{ fontFamily: 'Caveat', color: '#888', fontSize: 12 }}>{t}</span>)}
          <SketchBtn label="☎ Звъни" variant="yellow" style={{ fontSize: 11, padding: '3px 10px', boxShadow: '2px 2px 0 #555' }} />
        </div>
      </div>

      {/* Full bleed hero */}
      <div style={{ position: 'relative' }}>
        <SketchImg h={200} label="📷 aerial shot / кран над купчина метал" style={{ borderTop: 'none', borderBottom: '3px solid #f0c040', borderLeft: 'none', borderRight: 'none' }} />
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0,
          background: 'linear-gradient(transparent, rgba(20,20,16,0.97))',
          padding: '30px 16px 16px'
        }}>
          <SketchText size={24} bold color="#fff">PROGRESSTRADE</SketchText>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 1, background: '#333', margin: '0', borderTop: '1px solid #333' }}>

      {/* Transport section */}

          <SketchText size={15} bold color={C.yellow}>Идваме при вас</SketchText>

      {/* Target groups */}
      <div style={{ padding: 14, background: '#1e1e1a', borderTop: '2px solid #333' }}>
        <SketchText size={14} bold color="#eee" style={{ marginBottom: 8 }}>Работим с:</SketchText>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {['🔧 Сервизи', '🏗️ Строители', '🏭 Заводи'].map(t => (
            <div key={t} style={{ border: '1.5px solid #f0c040', borderRadius: 2, padding: '4px 10px' }}>

      </div>

      {/* Big CTA */}
      <div style={{ background: C.yellow, padding: 16, textAlign: 'center', borderTop: '2px solid #333' }}>
        <SketchText size={20} bold color={C.green}>0893 416 559</SketchText>
        <SketchText size={11} color="#444" style={{ marginTop: 4 }}>Военна Рампа, ул. Проф Иван Георгов 1, София</SketchText>
        <SketchBtn label="Отвори в Google Maps" variant="green" style={{ marginTop: 10, fontSize: 11 }} />
