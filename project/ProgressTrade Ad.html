<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProgressTrade – Facebook Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Barlow', sans-serif;
  }

  .stage {
    width: 1200px;
    height: 628px;
    position: relative;
    overflow: hidden;
    transform-origin: top left;
  }

  /* ── Background ── */
  .bg {
    position: absolute; inset: 0;
    background: #0d0d0d;
  }

  /* Metal texture via repeating lines */
  .bg::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(
        -45deg,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,0.018) 3px,
        rgba(255,255,255,0.018) 4px
      );
  }

  /* Dark vignette */
  .bg::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 30%, rgba(0,0,0,0.65) 100%);
  }

  /* ── Left colored slab ── */
  .slab {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 480px;
    background: linear-gradient(160deg, #e67e00 0%, #c25c00 60%, #8a3800 100%);
    clip-path: polygon(0 0, 88% 0, 100% 100%, 0 100%);
  }

  .slab::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent 0px,
      transparent 6px,
      rgba(0,0,0,0.06) 6px,
      rgba(0,0,0,0.06) 7px
    );
    clip-path: polygon(0 0, 88% 0, 100% 100%, 0 100%);
  }

  /* ── Scrap metal silhouette placeholder ── */
  .scrap-img {
    position: absolute;
    right: 0; bottom: 0;
    width: 620px;
    height: 540px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .scrap-placeholder {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  /* Stylized metal pile silhouette using CSS shapes */
  .scrap-placeholder svg {
    width: 100%;
    height: 100%;
    opacity: 0.18;
  }

  /* ── Logo area ── */
  .logo {
    position: absolute;
    top: 38px;
    left: 42px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 10;
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    background: #fff;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: #e67e00;
    letter-spacing: -1px;
    flex-shrink: 0;
  }

  .logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1;
  }

  .logo-text span {
    color: #fff;
    opacity: 0.7;
    font-weight: 600;
  }

  /* ── Main headline ── */
  .headline {
    position: absolute;
    top: 118px;
    left: 42px;
    z-index: 10;
    max-width: 420px;
  }

  .headline-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .headline-main {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 88px;
    line-height: 0.9;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: -1px;
  }

  .headline-main .accent {
    color: #ffad3a;
    display: block;
  }

  .headline-main .city {
    font-size: 52px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    display: block;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* ── Advantages ── */
  .advantages {
    position: absolute;
    bottom: 52px;
    left: 42px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .adv-item {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .adv-icon {
    width: 32px;
    height: 32px;
    background: #e67e00;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .adv-checkmark {
    width: 14px;
    height: 14px;
    border-right: 2.5px solid #fff;
    border-bottom: 2.5px solid #fff;
    transform: rotate(45deg) translate(-2px, -2px);
  }

  .adv-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #fff;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ── Price bubble ── */
  .price-bubble {
    position: absolute;
    top: 50%;
    right: 68px;
    transform: translateY(-50%);
    z-index: 20;
    width: 220px;
    height: 220px;
  }

  .price-bubble-inner {
    width: 100%;
    height: 100%;
    background: #e67e00;
    border-radius: 50%;
    border: 5px solid #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.2),
      0 20px 60px rgba(230,126,0,0.5),
      0 4px 20px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
    animation: pulse 2.8s ease-in-out infinite;
  }

  .price-bubble-inner::before {
    content: '';
    position: absolute;
    top: -30%;
    left: -20%;
    width: 60%;
    height: 60%;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 2px rgba(255,255,255,0.2), 0 20px 60px rgba(230,126,0,0.5), 0 4px 20px rgba(0,0,0,0.5); }
    50% { transform: scale(1.04); box-shadow: 0 0 0 2px rgba(255,255,255,0.3), 0 24px 70px rgba(230,126,0,0.7), 0 4px 24px rgba(0,0,0,0.6); }
  }

  .bubble-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: rgba(255,255,255,0.9);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .bubble-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 62px;
    color: #fff;
    line-height: 1;
    letter-spacing: -2px;
  }

  .bubble-price sup {
    font-size: 30px;
    vertical-align: super;
    letter-spacing: 0;
  }

  .bubble-unit {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: rgba(255,255,255,0.9);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: -2px;
  }

  /* ── Divider line ── */
  .divider {
    position: absolute;
    left: 42px;
    bottom: 170px;
    width: 320px;
    height: 2px;
    background: linear-gradient(90deg, rgba(230,126,0,0.9) 0%, rgba(230,126,0,0.1) 100%);
    z-index: 10;
  }

  /* ── Contact strip ── */
  .contact-strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 36px;
    background: linear-gradient(90deg, rgba(230,126,0,0.15) 0%, transparent 100%);
    border-top: 1px solid rgba(230,126,0,0.25);
    display: flex;
    align-items: center;
    padding: 0 42px;
    gap: 32px;
    z-index: 10;
  }

  .contact-item {
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .contact-item strong {
    color: rgba(255,255,255,0.85);
  }

  /* ── Steel beams decorative ── */
  .beam {
    position: absolute;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    z-index: 5;
  }
  .beam-1 { top: 0; left: 35%; width: 2px; height: 100%; transform: rotate(15deg) translateX(-100px); }
  .beam-2 { top: 0; left: 55%; width: 1px; height: 100%; transform: rotate(15deg) translateX(-100px); opacity: 0.5; }

  /* ── Responsive scaling ── */
  .scale-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    min-height: 100vh;
  }
</style>
</head>
<body>
<div class="scale-wrapper">
  <div class="stage" id="stage">

    <!-- Background -->
    <div class="bg"></div>

    <!-- Decorative beams -->
    <div class="beam beam-1"></div>
    <div class="beam beam-2"></div>

    <!-- Orange slab -->
    <div class="slab"></div>

    <!-- Scrap metal silhouette (CSS-only placeholder) -->
    <div class="scrap-img">
      <div class="scrap-placeholder">
        <svg viewBox="0 0 620 540" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Stylized industrial/metal pile shapes -->
          <rect x="80" y="380" width="180" height="14" rx="3" fill="white" transform="rotate(-8 80 380)"/>
          <rect x="180" y="360" width="220" height="12" rx="3" fill="white" transform="rotate(5 180 360)"/>
          <rect x="50" y="420" width="260" height="16" rx="3" fill="white" transform="rotate(-3 50 420)"/>
          <rect x="200" y="400" width="200" height="10" rx="3" fill="white" transform="rotate(12 200 400)"/>
          <rect x="300" y="350" width="180" height="14" rx="3" fill="white" transform="rotate(-6 300 350)"/>
          <rect x="120" y="460" width="300" height="18" rx="3" fill="white" transform="rotate(2 120 460)"/>
          <rect x="60" y="490" width="240" height="20" rx="3" fill="white" transform="rotate(-4 60 490)"/>
          <rect x="280" y="440" width="220" height="12" rx="3" fill="white" transform="rotate(8 280 440)"/>
          <rect x="350" y="390" width="150" height="10" rx="3" fill="white" transform="rotate(-10 350 390)"/>
          <rect x="400" y="460" width="170" height="16" rx="3" fill="white" transform="rotate(3 400 460)"/>
          <rect x="160" y="320" width="120" height="10" rx="3" fill="white" transform="rotate(-15 160 320)"/>
          <rect x="320" y="300" width="140" height="8" rx="3" fill="white" transform="rotate(7 320 300)"/>
          <!-- Gear / industrial icons -->
          <circle cx="490" cy="200" r="80" stroke="white" stroke-width="6" fill="none"/>
          <circle cx="490" cy="200" r="50" stroke="white" stroke-width="4" fill="none"/>
          <line x1="490" y1="110" x2="490" y2="90" stroke="white" stroke-width="8"/>
          <line x1="490" y1="290" x2="490" y2="310" stroke="white" stroke-width="8"/>
          <line x1="400" y1="200" x2="380" y2="200" stroke="white" stroke-width="8"/>
          <line x1="580" y1="200" x2="600" y2="200" stroke="white" stroke-width="8"/>
          <line x1="433" y1="143" x2="419" y2="129" stroke="white" stroke-width="8"/>
          <line x1="547" y1="257" x2="561" y2="271" stroke="white" stroke-width="8"/>
          <line x1="547" y1="143" x2="561" y2="129" stroke="white" stroke-width="8"/>
          <line x1="433" y1="257" x2="419" y2="271" stroke="white" stroke-width="8"/>
          <!-- Recycling arrows hint -->
          <path d="M150 180 Q160 140 200 140 Q240 140 250 180" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
          <polygon points="255,172 265,185 245,187" fill="white"/>
          <path d="M250 210 Q240 250 200 250 Q160 250 150 210" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
          <polygon points="145,218 135,205 155,203" fill="white"/>
        </svg>
      </div>
    </div>

    <!-- Logo -->
    <div class="logo">
      <div class="logo-mark">
        <div class="logo-icon">PT</div>
        <div class="logo-text">PROGRESS<span>TRADE</span></div>
      </div>
    </div>

    <!-- Main Headline -->
    <div class="headline">
      <div class="headline-sub">Изкупуване на</div>
      <div class="headline-main">
        ЖЕЛЕЗЕН
        <span class="accent">СКРАП</span>
        <span class="city">– СОФИЯ –</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Advantages -->
    <div class="advantages">
      <div class="adv-item">
        <div class="adv-icon"><div class="adv-checkmark"></div></div>
        <div class="adv-text">Най-висока цена</div>
      </div>
      <div class="adv-item">
        <div class="adv-icon"><div class="adv-checkmark"></div></div>
        <div class="adv-text">Бързо и коректно обслужване</div>
      </div>
      <div class="adv-item">
        <div class="adv-icon"><div class="adv-checkmark"></div></div>
        <div class="adv-text">Лесно разтоварване</div>
      </div>
    </div>

    <!-- Price Bubble -->
    <div class="price-bubble">
      <div class="price-bubble-inner">
        <div class="bubble-label">Цена до</div>
        <div class="bubble-price">270<sup>€</sup></div>
        <div class="bubble-unit">на тон</div>
      </div>
    </div>

    <!-- Contact strip -->
    <div class="contact-strip">
      <div class="contact-item">progresstrade.bg</div>
      <div class="contact-item"><strong>Вземаме в цяла София</strong></div>
      <div class="contact-item">Обади се сега →</div>
    </div>

  </div>
</div>

<script>
  // Responsive scaling to fit viewport
  function scaleStage() {
    const stage = document.getElementById('stage');
    const wrapper = stage.parentElement;
    const vw = wrapper.offsetWidth;
    const vh = wrapper.offsetHeight;
    const scaleX = vw / 1200;
    const scaleY = vh / 628;
    const scale = Math.min(scaleX, scaleY, 1);
    stage.style.transform = `scale(${scale})`;
    stage.style.transformOrigin = 'center center';
  }
  scaleStage();
  window.addEventListener('resize', scaleStage);
</script>
</body>
</html>
